 topicList:['doctype','html','head','body','meta-charset','meta-viewport','meta-description','title','link','script'],

  'An HTML file is a **tree of elements**. An element is written `<name attr="value">content</name>`. Elements with no content (`<meta>`, `<link>`, `<br>`) are **void**: they have no closing tag.',
  '`<!DOCTYPE html>` is not an element. It tells the browser to use modern standards mode. Then `<html>` is the root and has exactly two children:',
  '- `<head>`: metadata, not drawn on the page.',
  '- `<body>`: everything the user actually sees.',
  'Typical head contents: `<meta charset>` (text encoding), `<meta name="viewport">` (mobile scaling), `<meta name="description">` (search-engine snippet), `<title>` (tab title), `<link>` (relates another file, usually CSS) and `<script>` (JavaScript). Python analogy: head ≈ imports and config, body ≈ `main()`.'
 ],

  <title>My Page</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"><\/script>
</head>
<body>
  <h1>Hello</h1>

 id:'L5', title:'Tables', blurb:'table, tr, td, th, thead/tbody/tfoot, colspan, rowspan, caption',
 topicList:['table','tr','td-th','thead-tbody-tfoot','colspan','rowspan','caption'],
 intro:[
  'A `<table>` is a list of rows. Each `<tr>` is a row; each cell inside it is `<td>` (data) or `<th>` (header). Tables are for data, not layout.',
  '`<thead>`, `<tbody>` and `<tfoot>` group rows into header, body and footer sections. They help styling, printing and accessibility. `<caption>` must be the first child of the table and gives it a title.',
  '`colspan="n"` makes a cell stretch over n columns; `rowspan="n"` stretches it over n rows. Cells covered by a span are **not written** in the later rows, so a row can have fewer `<td>`s than the table has columns.',
  'Reading tip: count columns from the widest row after adding the spans.'
 ],
 example:{ h:230, code:`<table>
  <caption>Quarterly sales</caption>

    <tr><td>Q1</td><td>10</td><td>12</td></tr>
    <tr><td rowspan="2">Q2</td><td>15</td><td>18</td></tr>
    <tr><td>20</td><td>22</td></tr>
  </tbody>

{
 id:'L6', title:'Forms', blurb:'form, input types, label, select, textarea, buttons, GET vs POST',
 topicList:['form-action','form-method','get-url','post','text','email','password','number','date','checkbox','radio','file','range','color','hidden','label-for','label-wrap','select-option','textarea','button-submit','button-reset','button-button'],
 demo:'request',
 intro:[
  '`<form action="URL" method="get|post">` groups controls. **GET** puts the data into the URL (`/search?q=cats`): visible, bookmarkable, good for searches. **POST** puts it in the request body: the URL stays `/search`; use it for logins and changes. Try the demo below.',
  'A control is only sent if it has a **`name`**. The key is the `name`, the value is what the user entered (or the `value` attribute).',
  '`<input type="…">` changes the widget: `text`, `email`, `password`, `number`, `date`, `checkbox`, `radio` (same `name` = one group), `file`, `range`, `color`, `hidden`. `<label>` connects text to a control either with `for="id"` or by wrapping it. `<select>` + `<option value>`, `<textarea>…</textarea>`.',
  'Buttons: `type="submit"` (default inside a form) sends, `type="reset"` restores initial values, `type="button"` does nothing by itself.'
 ],
 example:{ h:360, code:`<form action="/search" method="get">
  <label for="q">Search:</label>
  <input type="text" id="q" name="q">
  <label>Email <input type="email" name="email"></label>
  <input type="password" name="pw">
  <input type="number" name="age">
  <input type="date" name="dob">
  <input type="checkbox" name="news" value="yes"> News
  <input type="radio" name="size" value="s"> S
  <input type="radio" name="size" value="m"> M
  <input type="file" name="doc">
  <input type="range" name="vol">
  <input type="color" name="c">
  <input type="hidden" name="token" value="abc123">
  <select name="country">
    <option value="il">Israel</option>
    <option value="us">USA</option>
  </select>
  <textarea name="msg">Hi</textarea>
  <button type="submit">Send</button>
  <button type="reset">Clear</button>
  <button type="button">Do nothing</button>
</form>` },

{
 id:'L7', title:'Form validation attributes', blurb:'required, placeholder, value, min/max, minlength/maxlength, pattern, disabled, readonly, checked, selected',
 topicList:['required','placeholder','value','min','max','minlength','maxlength','pattern','disabled','readonly','checked','selected'],
 intro:[
  'Attributes on form controls tell the **browser** how to validate before it sends anything. If a rule fails, submission is **blocked** and the browser shows a message.',
  '- `required`: must not be empty. `placeholder`: a grey hint, **not** a value and never validated or sent. `value`: the initial (default) content.',
  '- `min`/`max`: limits for `number`, `date`, `range` (inclusive). `minlength`/`maxlength`: text length; `maxlength` also stops typing. `pattern`: a regular expression the whole value must match.',
  '- `disabled`: greyed out, not focusable, **not submitted**, skipped by validation. `readonly`: cannot be edited but **is** submitted, and is also skipped by validation.',
  '- `checked` (checkbox/radio) and `selected` (option) set the default state. Boolean attributes are true whenever present: `disabled="false"` is still disabled.',
  'Several questions below have a **live form**: predict first, then try it.'
 ],
 example:{ h:230, code:`<form action="#">
  <input type="text" name="user" required placeholder="Username">
  <input type="number" name="age" min="18" max="99" value="30">
  <input type="text" name="zip" pattern="[0-9]{5}" minlength="5" maxlength="5">
  <input type="text" name="id" value="A-17" readonly>
  <input type="text" name="old" value="locked" disabled>
  <input type="checkbox" name="tos" required checked> I agree
  <select name="plan">
    <option value="free">Free</option>
    <option value="pro" selected>Pro</option>
  </select>
  <button type="submit">Send</button>
</form>` },
 questions:[

{
 id:'L8', title:'Global attributes', blurb:'id, class, name, style, title, hidden',
 topicList:['id','class','name','style','title','hidden'],
 intro:[
  'Global attributes can be put on any element.',
  '- `id`: a **unique** label per page. Targets for `#anchor` links, `<label for>`, CSS and JavaScript.',
  '- `class`: a **reusable** label; one element may have several, separated by spaces (`class="card big"` = two classes).',
  '- `name`: not global in the strict sense. It identifies a **form control** in the submitted data (`?q=…`) and groups radio buttons.',
  '- `style`: inline CSS (`property: value;`). `title`: a tooltip on hover. `hidden`: the element is in the DOM but not displayed.',
  'Quick rule: need to find it once → `id`; group of similar things → `class`; sending form data → `name`.'
 ],

{
 id:'L9', title:'Semantic HTML', blurb:'header, nav, main, footer, section, article, aside',
 topicList:['header','nav','main','footer','section','article','aside','div-vs-semantic'],
 intro:[
  'Semantic tags look like `<div>`s in the browser (plain blocks) but **say what the content is**. Screen readers can jump between landmarks, search engines understand the page, and you can read the structure at a glance.',
  '- `<header>`: intro or top of a page or section. `<nav>`: main navigation links. `<main>`: the dominant content, once per page. `<footer>`: closing info.',
  '- `<section>`: a thematic group, normally with a heading. `<article>`: a self-contained piece that makes sense alone (post, comment, product card). `<aside>`: tangential content like a sidebar.',
  'Below, the same page twice: first with only divs, then semantic. Hover over the tags in the second one.'
 ],

{
 id:'L10', title:'Boss level', blurb:'A realistic page that combines everything',
 topicList:[],
 intro:[
  'The page below is a small coffee-shop site. It combines every level: document structure, text, lists, links and media, a table, a form with validation, global attributes and semantic layout.',
  'Read it top-down, then answer 15+ questions about it. The full code stays visible next to every question; line numbers help you refer to it. Take your time: reading is the skill.'
 ],
 example:{ h:360, code:'@shared' },
 shared:`<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bean There: a tiny coffee shop">
  <title>Bean There Coffee</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"><\/script>
</head>
<body>
  <header id="top" class="site-header">
    <h1>Bean There</h1>
    <nav>
      <ul>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#order">Order</a></li>
        <li><a href="https://maps.example.com" target="_blank" rel="noopener noreferrer">Find us</a></li>
        <li><a href="mailto:hello@beanthere.example">Email</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="menu">
      <h2>Menu</h2>
      <p>Roasted <strong>every morning</strong>.<br>Ask about our <em>seasonal</em> blends.</p>
      <table>
        <caption>Prices (USD)</caption>
        <thead>
          <tr><th>Drink</th><th>Small</th><th>Large</th></tr>
        </thead>
        <tbody>
          <tr><td>Espresso</td><td>2.50</td><td>3.50</td></tr>
          <tr><td>Latte</td><td colspan="2">4.00</td></tr>
        </tbody>
      </table>
      <img src="img/beans.jpg" alt="A pile of roasted beans" width="300" height="200">
      <video controls width="320">
        <source src="roast.mp4" type="video/mp4">
        <source src="roast.webm" type="video/webm">
      </video>
    </section>

    <hr>

    <section id="order">
      <h2>Order</h2>
      <form action="/order" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">
        <label>Email <input type="email" name="email" required></label>
        <input type="number" name="qty" min="1" max="10" value="1">
        <input type="radio" name="size" value="s" checked> Small
        <input type="radio" name="size" value="l"> Large
        <select name="drink">
          <option value="es">Espresso</option>
          <option value="la" selected>Latte</option>
        </select>
        <textarea name="note" maxlength="100"></textarea>
        <input type="hidden" name="shop" value="42">
        <input type="text" name="promo" pattern="[A-Z]{4}" disabled>
        <button type="submit">Send</button>
        <button type="reset">Clear</button>
      </form>
    </section>

    <article>
      <h2>Our story</h2>
      <p>We opened in <span class="year">2019</span>.</p>
      <ol>
        <li>Roast</li>
        <li>Grind</li>
        <li>Brew</li>
      </ol>
    </article>

    <aside hidden>
      <p>Closed on Sundays.</p>
    </aside>
  </main>

  <footer>
    <div class="map">
      <iframe src="https://maps.example.com/embed" width="300" height="150"></iframe>
    </div>
    <p>Call <a href="tel:+15551234567">555-1234</a></p>
    <p style="color: gray;" title="Last update">(c) Bean There</p>
  </footer>
</body>
</html>`,

<style>
:root{
  --bg:#f5f6fa; --card:#ffffff; --ink:#1b2130; --mute:#5f6b82; --line:#dfe3ec;
  --acc:#4338ca; --acc-ink:#ffffff; --acc-soft:#eceefe;
  --ok:#15803d; --ok-bg:#e6f6ec; --bad:#c62828; --bad-bg:#fdeaea; --warn:#b45309; --warn-bg:#fff4e0;
  --code-bg:#f2f4f9; --tn:#b0205c; --an:#9a4a00; --av:#0b7447; --pn:#7c869b; --cm:#7c869b; --dt:#6a38c2; --rw:#445066;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
:root[data-theme="dark"]{
  --bg:#0f121a; --card:#171b26; --ink:#e7eaf3; --mute:#9aa5bd; --line:#2a3144;
  --acc:#8b8cff; --acc-ink:#0f121a; --acc-soft:#242850;
  --ok:#4ade80; --ok-bg:#12301f; --bad:#ff7b7b; --bad-bg:#3a1a1e; --warn:#fbbf24; --warn-bg:#3a2e12;
  --code-bg:#11141d; --tn:#ff7ab2; --an:#ffb86b; --av:#7ee2a8; --pn:#7d879f; --cm:#7d879f; --dt:#c3a2ff; --rw:#a8b3c9;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code{font-family:var(--mono);font-size:.88em;background:var(--code-bg);border:1px solid var(--line);border-radius:5px;padding:.05em .35em}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font:700 1.15rem var(--mono);letter-spacing:-.02em}
.brand span{color:var(--acc)}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;color:var(--mute);font-weight:600}
.tabs button:hover{background:var(--acc-soft)}
.tabs button.on{background:var(--acc-soft);color:var(--acc)}
.stats{margin-left:auto;display:flex;align-items:center;gap:14px}
.overall{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mute)}
.bar{width:140px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s}
.pts{font-weight:700}
.pts b{color:var(--acc)}
#theme{border:1px solid var(--line);background:var(--card);border-radius:8px;width:36px;height:34px;font-size:1.1rem}
#theme:hover{background:var(--acc-soft)}

main{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
.view[hidden]{display:none}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:9px;font-weight:600}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}

/* level map */
.lead{max-width:70ch;color:var(--mute);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.lvl{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-height:140px}
.lvl:not(:disabled):hover{border-color:var(--acc);transform:translateY(-1px)}
.lvl:disabled{opacity:.55;cursor:not-allowed}
.lvl .n{font:700 .8rem var(--mono);color:var(--acc)}
.lvl h3{margin:0;font-size:1.05rem}
.lvl p{margin:0;color:var(--mute);font-size:.85rem}
.lvl .st{margin-top:auto;font-size:.85rem;font-weight:600}
.lvl.done{border-color:var(--ok)}
.lvl.done .st{color:var(--ok)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}

/* lesson */
.lesson{display:grid;gap:18px}
.lesson .intro p,.lesson .intro ul{max-width:75ch;margin:.5em 0}
.lesson .intro li{margin:.25em 0}
.hint{font-size:.85rem;color:var(--mute);margin:0 0 8px}
.exwrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:820px){.exwrap{grid-template-columns:1fr}}
.pv{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;display:block}
.pvlabel{font-size:.78rem;color:var(--mute);margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em}

/* code */
.codewrap{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:430px;font:13.5px/1.6 var(--mono)}
.code{padding:8px 0;min-width:max-content}
.cl{display:flex;padding:0 12px 0 0;white-space:pre}
.cl .ln{flex:none;width:3.2ch;margin-right:1.2ch;padding-left:.8ch;text-align:right;color:var(--pn);opacity:.7;user-select:none}
.cl .lc{flex:1}
.pn{color:var(--pn)}.tn{color:var(--tn);font-weight:600}.an{color:var(--an)}.av{color:var(--av)}
.cm{color:var(--cm);font-style:italic}.dt{color:var(--dt)}.rw{color:var(--rw)}
pre.mini{margin:0;padding:8px 10px;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;font:12.5px/1.5 var(--mono);overflow:auto;white-space:pre}
.annot [data-tag]{cursor:help}
.hov{background:rgba(99,102,241,.22);border-radius:3px}
.clickable [data-sel],.annot [data-tag]{border-radius:3px}
.clickable [data-sel]{cursor:pointer}
.lineclick .cl{cursor:pointer}
.lineclick .cl:hover{background:rgba(99,102,241,.14)}
.hl{background:var(--warn-bg);outline:1.5px solid var(--warn);border-radius:3px}
.ok{background:var(--ok-bg)!important;outline:1.5px solid var(--ok);border-radius:3px}
.bad{background:var(--bad-bg)!important;outline:1.5px solid var(--bad);border-radius:3px}
.cl.ok,.cl.bad{border-radius:0}

#tip{position:fixed;z-index:50;max-width:340px;padding:9px 12px;border-radius:9px;background:#10131c;color:#eef1f8;font-size:.85rem;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.35);pointer-events:none}
#tip[hidden]{display:none}
#tip code{background:#232a3d;border-color:#334;color:#cfe}
#tip i{opacity:.7}

/* demo */
.demo{display:grid;gap:10px}
.demo .drow{display:flex;gap:14px;flex-wrap:wrap}
.demo label{display:flex;gap:6px;align-items:center;font-size:.9rem}
.demo input,.demo select{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);max-width:170px}
.demo .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.demo .cols{grid-template-columns:1fr}}
.addr{font:13px var(--mono);padding:6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--bg);word-break:break-all}

/* quiz */
.qtop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.qtitle{font-weight:700}
.hud{margin-left:auto;display:flex;gap:16px;align-items:center;font-weight:600;font-size:.95rem}
.lives{color:var(--bad);letter-spacing:2px;font-size:1.1rem}
.lives .off{opacity:.25}
.qprog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:14px}
.qprog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.badge{display:inline-block;font:700 .72rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--acc);background:var(--acc-soft);padding:3px 9px;border-radius:99px;margin-bottom:8px}
.qtext{font-size:1.1rem;font-weight:600;margin:0 0 12px}
.qbody{display:grid;gap:12px}
.sub{font-size:.85rem;color:var(--mute)}
.choices{display:grid;gap:8px}
.choices.tree2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.choice:hover{border-color:var(--acc);background:var(--acc-soft)}
.key{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--acc-soft);color:var(--acc);font:700 .78rem var(--mono)}
.choice .ct{flex:1;min-width:0}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)!important}
.choice.bad{border-color:var(--bad);background:var(--bad-bg)!important}
pre.tree{margin:0;font:13px/1.45 var(--mono);white-space:pre;overflow:auto}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pcard{position:relative;border:2px solid var(--line);border-radius:12px;padding:6px;background:var(--card);cursor:pointer}
.pcard:hover{border-color:var(--acc)}
.pcard .key{position:absolute;top:10px;left:10px;z-index:2}
.pcard.ok{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.pcard.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.shield{position:absolute;inset:0;z-index:1}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.match{grid-template-columns:1fr}}
.mleft,.mright{display:grid;gap:10px;align-content:start}
.mitem{position:relative;border:2px solid var(--line);border-radius:10px;padding:6px;background:var(--card);cursor:pointer}
.mitem:hover{border-color:var(--acc)}
.mitem.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.mitem.done{border-color:var(--ok);background:var(--ok-bg);cursor:default}
.mnum{position:absolute;top:-9px;right:-9px;z-index:3;width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--bg);font:700 .75rem var(--mono);display:grid;place-items:center}
.mprev{padding:4px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mstatus{font-size:.85rem;color:var(--bad);min-height:1.2em}
.live{border:1px dashed var(--acc);border-radius:12px;padding:12px;display:grid;gap:8px}
.lstatus{font-weight:600}
.lstatus.s1{color:var(--ok)}.lstatus.s2{color:var(--bad)}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px;border:1.5px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb p{margin:.3em 0 .8em}
.fb .t{font-weight:700}
.fb.ok .t{color:var(--ok)}.fb.bad .t{color:var(--bad)}
.fb.ok,.fb.bad{outline:0}
.fb *{background:none}
.result{text-align:center;display:grid;gap:10px;justify-items:center;padding:30px 20px}
.result .big{font:800 3.2rem var(--mono);color:var(--acc)}
.result.fail .big{color:var(--bad)}
.result.pass .big{color:var(--ok)}
.stat3{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;color:var(--mute)}
.stat3 b{display:block;font-size:1.4rem;color:var(--ink)}

/* playground */
.pgbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pgbar select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.pgsplit{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:min(70vh,640px)}
@media(max-width:820px){.pgsplit{grid-template-columns:1fr;height:auto}.pgleft{height:320px}.pgright{height:320px}}
.pgleft{display:flex;flex-direction:column;min-height:0;gap:8px}
.pgedit{position:relative;flex:1;min-height:0;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#pghl,#pgta{position:absolute;inset:0;margin:0;padding:12px;border:0;font:13.5px/1.6 var(--mono);white-space:pre;tab-size:2;letter-spacing:0;word-spacing:0}
#pghl{overflow:hidden;color:var(--ink)}
#pgta{background:transparent;color:transparent;caret-color:var(--ink);resize:none;outline:none;overflow:auto;width:100%;height:100%}
#pgta::selection{background:rgba(99,102,241,.3);color:transparent}
.pgon{background:rgba(245,158,11,.35);border-radius:3px}
.pginfo{font-size:.85rem;color:var(--mute);min-height:2.6em}
.pgright{min-height:0}
#pgframe{width:100%;height:100%;border:1px solid var(--line);border-radius:10px;background:#fff}

/* cheat sheet */
.csearch{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.csearch input[type=search]{flex:1;min-width:220px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:.85rem}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.ccard p{margin:0;font-size:.92rem}
.chead{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cname{font-weight:700;font-size:.95rem;color:var(--tn)}
.chip{font:700 .66rem var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.chip.lv{background:var(--code-bg);color:var(--mute)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">&lt;/&gt; Read<span>HTML</span></div>
  <nav class="tabs" aria-label="Sections">
    <button data-tab="learn" class="on">Levels</button>
    <button data-tab="play">Playground</button>
    <button data-tab="cheat">Cheat sheet</button>
  </nav>
  <div class="stats">
    <div class="overall" title="Levels passed"><div class="bar"><i id="gbar"></i></div><span id="gtxt">0/10</span></div>
    <span class="pts">★ <b id="gscore">0</b></span>

  </div>
</header>
<main>
  <section id="v-learn" class="view"></section>
  <section id="v-play" class="view" hidden></section>
  <section id="v-cheat" class="view" hidden></section>
</main>
<div id="tip" role="tooltip" hidden></div>
<script>
(function () {
'use strict';

/* ================= helpers ================= */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
// Tiny inline markup: `code`, **bold**, *italic*
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*]+)\*/g, '<i>$1</i>');
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm0 = s => String(s).replace(/^\n/, '').replace(/\s+$/, '');
const normSel = s => (/:\d+$/.test(s) ? s : s + ':1');
const KEYS = 'ABCDEFG';

/* ================= course bookkeeping ================= */
const LV = {}, QMAP = {};
COURSE.levels.forEach(L => {
  LV[L.id] = L;
  L.questions.forEach((q, i) => { q.id = q.id || (L.id + '-' + (i + 1)); q.level = L.id; QMAP[q.id] = q; });
});
const getCode = q => norm0(q.code === '@shared' ? LV[q.level].shared : q.code);

/* ================= storage (safe) ================= */
const KEY = 'readhtml.progress.v1';
let store = { levels: {}, wrong: [], theme: null };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) { /* storage blocked: stay in memory */ }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { /* ignore */ } };

/* ================= HTML tokenizer ================= */
const VOID = new Set(['area', 'base', 'br', 'col', 'embed', 'hr', 'img', 'input', 'link', 'meta', 'source', 'track', 'wbr']);
const RE_TAG = /<(\/?)([a-zA-Z][a-zA-Z0-9-]*)/y;
const RE_ATTR = /([^\s"'<>\/=]+)(?:(\s*=\s*)("[^"]*"|'[^']*'|[^\s"'<>`=]+))?/y;

function tokenize(src) {
  const toks = [], n = src.length, cnt = {}, stack = [], low = src.toLowerCase();
  let i = 0, ts = 0, pg = 0;
  const flush = e => { if (e > ts) toks.push({ type: 'text', start: ts, end: e }); };
  const nth = k => (cnt[k] = (cnt[k] || 0) + 1);
  while (i < n) {
    if (src[i] !== '<') { i++; continue; }
    if (src.startsWith('<!--', i)) {
      flush(i); let e = src.indexOf('-->', i + 4); e = e < 0 ? n : e + 3;
      toks.push({ type: 'comment', start: i, end: e }); i = ts = e; continue;
    }
    if (/^<!doctype/i.test(src.substr(i, 9))) {
      flush(i); let e = src.indexOf('>', i); e = e < 0 ? n : e + 1;
      toks.push({ type: 'doctype', name: '!doctype', start: i, end: e }); i = ts = e; continue;
    }
    RE_TAG.lastIndex = i;
    const m = RE_TAG.exec(src);
    if (!m) { i++; continue; }
    flush(i);
    const close = !!m[1], name = m[2].toLowerCase();
    const t = { type: close ? 'close' : 'open', name, start: i, attrs: [], pair: -1 };
    let j = i + m[0].length;
    for (;;) {
      while (j < n && /\s/.test(src[j])) j++;
      if (j >= n) { t.closeStart = n; break; }
      if (src[j] === '>') { t.closeStart = j; j++; break; }
      if (src[j] === '/' && src[j + 1] === '>') { t.closeStart = j; t.self = true; j += 2; break; }
      RE_ATTR.lastIndex = j;
      const am = RE_ATTR.exec(src);
      if (!am) { j++; continue; }
      const a = { name: am[1].toLowerCase(), ns: j, ne: j + am[1].length };
      if (am[2]) {
        a.es = a.ne; a.ee = a.ne + am[2].length; a.vs = a.ee; a.ve = a.vs + am[3].length;
        a.value = am[3].replace(/^["']|["']$/g, '');
      }
      a.sel = '@' + a.name + ':' + nth('@' + a.name);
      t.attrs.push(a);
      j += am[0].length;
    }
    t.end = j;
    if (!close) {
      t.sel = name + ':' + nth(name);
      t.pg = pg++;
      if (!VOID.has(name) && !t.self) stack.push(t);
    } else {
      t.sel = '/' + name + ':' + nth('/' + name);
      for (let k = stack.length - 1; k >= 0; k--) {
        if (stack[k].name === name) { t.pair = stack[k].pg; stack.length = k; break; }
      }
    }
    toks.push(t);
    i = ts = j;
    if (!close && (name === 'script' || name === 'style') && !t.self) {
      let e = low.indexOf('</' + name, j); if (e < 0) e = n;
      if (e > j) toks.push({ type: 'raw', start: j, end: e });
      i = ts = e;
    }
  }
  flush(n);
  return toks;
}

/* ================= syntax highlighter =================
   Returns line-numbered HTML, or flat spans when o.flat.
   o.hl: selector to mark   o.tips: add tooltip data   o.pg: playground ids */
function highlight(src, o) {
  o = o || {};
  const toks = tokenize(src);
  const lines = [''];
  const emit = (text, cls, at) => {
    text.split('\n').forEach((p, k) => {
      if (k) lines.push('');
      if (p) lines[lines.length - 1] += '<span class="' + cls + '"' + at + '>' + esc(p) + '</span>';
    });
  };
  let hlA = -1, hlB = -1;
  if (o.hl) {
    const sel = normSel(o.hl);
    toks.forEach((t, ti) => { if (t.type === 'open' && t.sel === sel) { hlA = ti; } });
    if (hlA >= 0) { const pg = toks[hlA].pg; toks.forEach((t, ti) => { if (t.type === 'close' && t.pair === pg) hlB = ti; }); }
  }
  toks.forEach((t, ti) => {
    if (t.type !== 'open' && t.type !== 'close') {
      const cls = { comment: 'cm', doctype: 'dt', raw: 'rw', text: 'tx' }[t.type];
      const at = (t.type === 'doctype' && o.tips) ? ' data-tag="!doctype"' : '';
      emit(src.slice(t.start, t.end), cls, at);
      return;
    }
    let cur = t.start;
    const base = ' data-sel="' + t.sel + '" data-t="' + ti + '"'
      + (o.tips ? ' data-tag="' + t.name + '"' : '')
      + (o.pg ? ' data-pg="' + (t.type === 'open' ? t.pg : t.pair) + '"' : '');
    const hl = (ti === hlA || ti === hlB) ? ' hl' : '';
    const add = (s, e, cls, a) => {
      if (s > cur) emit(src.slice(cur, s), 'tx' + hl, base);
      let at = base;
      if (a) at += ' data-asel="' + a.sel + '"' + (o.tips ? ' data-attr="' + a.name + '"' : '');
      emit(src.slice(s, e), cls + hl, at);
      cur = e;
    };
    const lt = t.type === 'open' ? 1 : 2;
    add(t.start, t.start + lt, 'pn');
    add(t.start + lt, t.start + lt + t.name.length, 'tn');
    t.attrs.forEach(a => {
      add(a.ns, a.ne, 'an', a);
      if (a.vs != null) { add(a.es, a.ee, 'pn', a); add(a.vs, a.ve, 'av', a); }
    });
    add(t.closeStart, t.end, 'pn');
  });
  if (o.flat) return lines.join('\n');
  return '<div class="code">' + lines.map((h, i) =>
    '<div class="cl" data-line="' + (i + 1) + '"><span class="ln">' + (i + 1) + '</span><span class="lc">' + (h || ' ') + '</span></div>').join('') + '</div>';
}

/* ================= tree notation ================= */
function parseTree(s) {
  let i = 0;
  function node() {
    const st = i;
    while (i < s.length && !'(),'.includes(s[i])) i++;
    const name = s.slice(st, i).trim(), kids = [];
    if (s[i] === '(') { i++; for (;;) { kids.push(node()); if (s[i] === ',') { i++; continue; } break; } i++; }
    return { name, kids };
  }
  return node();
}
function treeText(root) {
  const out = [root.name];
  (function rec(n, pre) {
    n.kids.forEach((k, i) => {
      const last = i === n.kids.length - 1;
      out.push(pre + (last ? '└─ ' : '├─ ') + k.name);
      rec(k, pre + (last ? '   ' : '│  '));
    });
  })(root, '');
  return out.join('\n');
}

/* ================= preview frames ================= */
const PV_CSS = 'body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;margin:8px;color:#111;background:#fff}table,td,th{border:1px solid #888;border-collapse:collapse}td,th{padding:2px 8px}';
const previewDoc = h => '<!DOCTYPE html><meta charset="utf-8"><style>' + PV_CSS + '</style>' + h;
function frame(html, height, sandbox, raw) {
  const f = document.createElement('iframe');
  f.className = 'pv';
  f.setAttribute('sandbox', sandbox || 'allow-scripts');
  f.style.height = (height || 120) + 'px';
  f.title = 'Rendered preview';
  f.srcdoc = raw ? html : previewDoc(html);
  return f;
}
// One message listener for every frame that talks back to the page
const msgHandlers = [];
window.addEventListener('message', e => msgHandlers.forEach(fn => fn(e)));

/* ================= cheat sheet lookup / tooltips ================= */
const CH = {};
CHEAT.forEach(r => (r[5] || [r[0]]).forEach(n => { CH[r[1] + ':' + n.toLowerCase()] = r; }));
function tipFor(tag, attr, notes) {
  notes = notes || {};
  if (attr) {
    const note = notes[tag + '@' + attr] || notes['@' + attr];
    const r = CH['attr:' + attr];
    return '<b>' + esc(attr) + '</b> <i>attribute of &lt;' + esc(tag) + '&gt;</i><br>' + fmt(note || (r ? r[3] : 'An attribute of this element.'));
  }
  const r = CH['tag:' + tag];
  const label = tag === '!doctype' ? '&lt;!DOCTYPE html&gt;' : '&lt;' + esc(tag) + '&gt;';
  return '<b>' + label + '</b><br>' + fmt(notes[tag] || (r ? r[3] : 'An HTML element.'));
}
const tip = $('#tip');
let tipNotes = null;
function hoverGroup(box, target) {
  $$('.hov', box).forEach(x => x.classList.remove('hov'));
  if (!target) return;
  const a = target.closest('[data-asel]');
  const peers = a ? $$('[data-asel="' + a.dataset.asel + '"]', box) : $$('[data-t="' + target.dataset.t + '"]', box);
  peers.forEach(x => x.classList.add('hov'));
}
document.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('.annot [data-tag]');
  const box = t && t.closest('.annot');
  if (!t) { tip.hidden = true; $$('.annot .hov').forEach(x => x.classList.remove('hov')); return; }
  tip.innerHTML = tipFor(t.dataset.tag, t.dataset.attr, box._notes);
  tip.hidden = false;
  hoverGroup(box, t);
});
document.addEventListener('mousemove', e => {
  if (tip.hidden) return;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 16;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
});

/* ================= theme + header stats ================= */
function applyTheme(t) { document.documentElement.dataset.theme = t; }
applyTheme(store.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
$('#theme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  applyTheme(next); store.theme = next; save();
};
function updateStats() {
  const passed = COURSE.levels.filter(L => store.levels[L.id] && store.levels[L.id].passed).length;
  const total = COURSE.levels.reduce((s, L) => s + ((store.levels[L.id] || {}).bestScore || 0), 0);
  $('#gbar').style.width = (passed / COURSE.levels.length * 100) + '%';
  $('#gtxt').textContent = passed + '/' + COURSE.levels.length + ' levels';
  $('#gscore').textContent = total;
}
const isUnlocked = i => i === 0 || !!(store.levels[COURSE.levels[i - 1].id] || {}).passed;

/* ================= tabs ================= */
let S = { mode: 'map' };
function setTab(t) {
  ['learn', 'play', 'cheat'].forEach(x => { $('#v-' + x).hidden = x !== t; });
  $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if (t === 'play') initPlayground();
  if (t === 'cheat') initCheat();
}
$$('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));

/* ================= level map ================= */
function showLevels() {
  S = { mode: 'map' };
  setTab('learn');
  const v = $('#v-learn'); v.innerHTML = '';
  v.append(el('h2', '', 'Learn to read HTML'));
  v.append(el('p', 'lead', 'Ten short levels. Each one opens with a lesson, then a quiz of mixed exercises. Finish a level with at least 70% and no lives lost to unlock the next one. You lose a life on each wrong answer (3 per level).'));
  const g = el('div', 'grid');
  COURSE.levels.forEach((L, i) => {
    const r = store.levels[L.id] || {};
    const open = isUnlocked(i);
    const b = el('button', 'lvl' + (r.passed ? ' done' : ''));
    b.disabled = !open;
    b.innerHTML = '<span class="n">LEVEL ' + (i + 1) + '</span><h3>' + esc(L.title) + '</h3><p>' + esc(L.blurb) + '</p><span class="st">' +
      (!open ? '🔒 Locked: pass level ' + i + ' first' : r.passed ? '✓ Passed · best ' + r.best + '%' : r.attempts ? 'Best so far ' + (r.best || 0) + '%' : 'Ready') + '</span>';
    b.onclick = () => showLesson(i);
    g.append(b);
  });
  v.append(g);
  const row = el('div', 'row');
  const nWrong = store.wrong.filter(id => QMAP[id]).length;
  const rv = el('button', 'btn primary', 'Review mistakes (' + nWrong + ')');
  rv.disabled = !nWrong;
  rv.onclick = () => startQuiz(0, true);
  const rs = el('button', 'btn ghost', 'Reset progress');
  let armed = false;
  rs.onclick = () => {
    if (!armed) { armed = true; rs.textContent = 'Click again to erase all progress'; setTimeout(() => { armed = false; rs.textContent = 'Reset progress'; }, 3000); return; }
    store.levels = {}; store.wrong = []; save(); updateStats(); showLevels();
  };
  row.append(rv, rs);
  v.append(row);
  updateStats();
}

/* ================= lesson page ================= */
function lessonHTML(arr) {
  let out = '', list = false;
  arr.forEach(p => {
    if (p.startsWith('- ')) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + fmt(p.slice(2)) + '</li>'; }
    else { if (list) { out += '</ul>'; list = false; } out += '<p>' + fmt(p) + '</p>'; }
  });
  return out + (list ? '</ul>' : '');
}
function exampleBlock(L, ex, title) {
  const w = el('div', 'card');
  if (title) w.append(el('h3', '', esc(title)));
  w.append(el('p', 'hint', 'Hover over any tag, attribute or value to see what it does.'));
  const wrap = el('div', 'exwrap');
  const code = norm0(ex.code === '@shared' ? L.shared : ex.code);
  const cw = el('div', 'codewrap annot');
  cw.innerHTML = highlight(code, { tips: true });
  cw._notes = ex.notes;
  const right = el('div');
  right.append(el('div', 'pvlabel', 'What the browser draws'));
  right.append(frame(code, ex.h || 200));
  wrap.append(cw, right);
  w.append(wrap);
  return w;
}
function demoRequest() {
  const box = el('div', 'card demo');
  box.innerHTML = '<h3>Try it: what does the browser send?</h3>' +
    '<div class="drow"><label>method <select id="dm"><option>get</option><option>post</option></select></label>' +
    '<label>action <input id="da" value="/search"></label>' +
    '<label>user types q <input id="d1" value="red shoes"></label>' +
    '<label>hidden page <input id="d2" value="2"></label></div>' +
    '<div class="cols"><div><div class="pvlabel">The form</div><div class="codewrap" id="dcode"></div></div>' +
    '<div><div class="pvlabel">Address bar after Submit</div><div class="addr" id="daddr"></div>' +
    '<div class="pvlabel" style="margin-top:10px">Request on the wire</div><pre class="mini" id="dreq"></pre></div></div>';
  const upd = () => {
    const m = $('#dm', box).value, a = $('#da', box).value || '/', q = $('#d1', box).value, p = $('#d2', box).value;
    $('#dcode', box).innerHTML = highlight('<form action="' + a + '" method="' + m + '">\n  <input type="text" name="q">\n  <input type="hidden" name="page" value="' + p + '">\n  <button type="submit">Go</button>\n</form>');
    const qs = new URLSearchParams({ q: q, page: p }).toString();
    if (m === 'get') {
      $('#daddr', box).textContent = 'https://example.com' + a + '?' + qs;
      $('#dreq', box).textContent = 'GET ' + a + '?' + qs + ' HTTP/1.1\nHost: example.com';
    } else {
      $('#daddr', box).textContent = 'https://example.com' + a;
      $('#dreq', box).textContent = 'POST ' + a + ' HTTP/1.1\nHost: example.com\nContent-Type: application/x-www-form-urlencoded\n\n' + qs;
    }
  };
  $$('select,input', box).forEach(i => i.oninput = upd);
  upd();
  return box;
}
function showLesson(i) {
  const L = COURSE.levels[i];
  S = { mode: 'lesson', li: i };
  const v = $('#v-learn'); v.innerHTML = '';
  const row = el('div', 'row');
  const back = el('button', 'btn ghost', '← All levels'); back.onclick = showLevels;
  row.append(back); v.append(row);
  const wrap = el('div', 'lesson');
  const head = el('div', 'card');
  head.innerHTML = '<span class="badge">Level ' + (i + 1) + '</span><h2>' + esc(L.title) + '</h2><div class="intro">' + lessonHTML(L.intro) + '</div>';
  wrap.append(head);
  if (L.demo === 'request') wrap.append(demoRequest());
  wrap.append(exampleBlock(L, L.example, L.id === 'L10' ? 'The page you will be quizzed on' : 'Annotated example'));
  if (L.example2) wrap.append(exampleBlock(L, L.example2, L.example2.title));
  const go = el('div', 'row');
  const start = el('button', 'btn primary', 'Start quiz (' + L.questions.length + ' questions) →');
  start.onclick = () => startQuiz(i, false);
  go.append(start);
  wrap.append(go);
  v.append(wrap);
  window.scrollTo(0, 0);
}

/* ================= quiz engine ================= */
const LABEL = { render: 'What does this render?', click: 'Click the element', parent: 'Find the parent', bug: 'Spot the bug', match: 'Match', tree: 'Tree view', happens: 'What happens?', versus: 'This vs that', choice: 'Quick question', form: 'Predict, then try it' };

function startQuiz(li, review) {
  const L = COURSE.levels[li];
  let qs;
  if (review) { qs = shuffle(store.wrong.map(id => QMAP[id]).filter(Boolean)); if (!qs.length) return; }
  else qs = L.questions.slice();
  S = { mode: 'quiz', li, L, review, qs, qi: 0, lives: review ? Infinity : COURSE.lives, score: 0, streak: 0, maxStreak: 0, correct: 0, answered: false };
  showQuestion();
}
function hudLives() {
  if (S.review) return '∞';
  let h = '';
  for (let i = 0; i < COURSE.lives; i++) h += '<span class="' + (i < S.lives ? '' : 'off') + '">♥</span>';
  return h;
}
function updateHud() {
  S.hud.innerHTML = '<span class="lives" title="Lives">' + hudLives() + '</span><span>Score <b>' + S.score + '</b></span><span title="Current streak">🔥 ' + S.streak + '</span>';
}
function showQuestion() {
  const v = $('#v-learn'); v.innerHTML = '';
  const q = S.qs[S.qi]; S.answered = false;
  const top = el('div', 'qtop');
  const back = el('button', 'btn ghost', '← Levels'); back.onclick = showLevels;
  const title = el('div', 'qtitle', S.review ? 'Review mistakes' : 'Level ' + (S.li + 1) + ' · ' + esc(S.L.title));
  S.hud = el('div', 'hud');
  top.append(back, title, S.hud);
  const prog = el('div', 'qprog'); prog.innerHTML = '<i style="width:' + (S.qi / S.qs.length * 100) + '%"></i>';
  const card = el('div', 'card');
  const where = S.review ? ' · ' + LV[q.level].title : '';
  card.append(el('span', 'badge', (LABEL[q.type] || 'Question') + where + ' · ' + (S.qi + 1) + '/' + S.qs.length));
  card.append(el('p', 'qtext', fmt(q.q)));
  const body = el('div', 'qbody');
  card.append(body);
  S.fb = el('div'); card.append(S.fb);
  v.append(top, prog, card);
  updateHud();
  BUILD[q.type](q, body, ok => finish(q, ok));
  window.scrollTo(0, 0);
}
function finish(q, ok) {
  if (S.answered) return;
  S.answered = true;
  let msg = '';
  if (ok) {
    S.streak++; S.maxStreak = Math.max(S.maxStreak, S.streak); S.correct++;
    const bonus = Math.min(S.streak - 1, 5) * 2, pts = 10 + bonus;
    S.score += pts;
    msg = '+' + pts + ' points' + (bonus ? ' (streak ×' + S.streak + ' bonus +' + bonus + ')' : '');
    store.wrong = store.wrong.filter(x => x !== q.id);
  } else {
    S.streak = 0;
    if (!S.review) S.lives--;
    if (!store.wrong.includes(q.id)) store.wrong.push(q.id);
    msg = S.review ? 'It stays in your review list.' : (S.lives > 0 ? S.lives + ' ' + (S.lives === 1 ? 'life' : 'lives') + ' left' : 'No lives left!');
  }
  save(); updateHud();
  const out = S.lives <= 0 || S.qi + 1 >= S.qs.length;
  S.fb.innerHTML = '';
  const fb = el('div', 'fb ' + (ok ? 'ok' : 'bad'));
  fb.innerHTML = '<div class="t">' + (ok ? '✓ Correct' : '✗ Not quite') + ' <span class="muted" style="font-weight:500">· ' + msg + '</span></div><p>' + fmt(q.why) + '</p>';
  const nx = el('button', 'btn primary', out ? 'See result →' : 'Next question →');
  nx.onclick = () => { S.qi++; if (out) showResult(); else showQuestion(); };
  fb.append(nx);
  S.fb.append(fb);
  nx.focus({ preventScroll: true });
  fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function showResult() {
  const n = S.qs.length, answered = S.qi, pct = Math.round(S.correct / n * 100);
  const outOfLives = S.lives <= 0;
  const passed = !S.review && !outOfLives && S.correct / n >= COURSE.passMark;
  if (!S.review) {
    const r = store.levels[S.L.id] || (store.levels[S.L.id] = { best: 0, bestScore: 0, passed: false, attempts: 0 });
    r.attempts++;
    if (!outOfLives) { r.best = Math.max(r.best, pct); r.bestScore = Math.max(r.bestScore, S.score); }
    if (passed) r.passed = true;
    save();
  }
  updateStats();
  const v = $('#v-learn'); v.innerHTML = '';
  const box = el('div', 'card result ' + (S.review ? '' : passed ? 'pass' : 'fail'));
  const title = S.review ? 'Review finished' : passed ? (S.L.id === 'L10' ? 'Course complete! 🎉' : 'Level passed!') : outOfLives ? 'Out of lives' : 'Not quite 70% yet';
  box.innerHTML = '<h2>' + title + '</h2><div class="big">' + (outOfLives ? S.correct + '/' + answered : pct + '%') + '</div>' +
    '<div class="stat3"><span><b>' + S.correct + '/' + (outOfLives ? answered : n) + '</b>correct</span><span><b>' + S.score + '</b>points</span><span><b>' + S.maxStreak + '</b>best streak</span></div>' +
    '<p class="muted">' + (S.review ? 'Questions you got right are removed from your review list.' :
      passed ? 'The next level is unlocked.' : outOfLives ? 'Three wrong answers end the attempt. Re-read the lesson and try again.' : 'You need at least 70% to unlock the next level.') + '</p>';
  const row = el('div', 'row'); row.style.justifyContent = 'center';
  if (!S.review) {
    const retry = el('button', 'btn', 'Retry level'); retry.onclick = () => startQuiz(S.li, false); row.append(retry);
    if (passed && COURSE.levels[S.li + 1]) { const nx = el('button', 'btn primary', 'Next level →'); nx.onclick = () => showLesson(S.li + 1); row.append(nx); }
  }
  const mistakes = store.wrong.filter(id => QMAP[id]).length;
  if (mistakes) { const rv = el('button', 'btn', 'Review mistakes (' + mistakes + ')'); rv.onclick = () => startQuiz(0, true); row.append(rv); }
  const map = el('button', 'btn ghost', 'All levels'); map.onclick = showLevels; row.append(map);
  box.append(row);
  v.append(box);
  window.scrollTo(0, 0);
}

/* ================= question builders ================= */
const BUILD = {};
const codeBox = (code, o) => { const c = el('div', 'codewrap'); c.innerHTML = highlight(code, o); return c; };

function choices(opts, ans, render, done, keep) {
  const items = opts.map((o, i) => ({ o, i }));
  const list = keep ? items : shuffle(items);
  const box = el('div', 'choices'), bs = [];
  list.forEach((it, k) => {
    const b = el('button', 'choice', '<span class="key">' + KEYS[k] + '</span><span class="ct">' + render(it.o) + '</span>');
    b.onclick = () => {
      if (S.answered) return;
      bs.forEach((x, j) => { if (list[j].i === ans) x.classList.add('ok'); });
      if (it.i !== ans) b.classList.add('bad');
      done(it.i === ans);
    };
    bs.push(b); box.append(b);
  });
  return box;
}
BUILD.choice = BUILD.happens = BUILD.versus = (q, body, done) => {
  if (q.code) body.append(codeBox(getCode(q)));
  body.append(choices(q.options, q.answer, fmt, done));
};
BUILD.parent = (q, body, done) => {
  const box = codeBox(getCode(q), { hl: q.target });
  body.append(box);
  const h = $('.hl', box);
  if (h) setTimeout(() => { box.scrollTop = Math.max(0, h.closest('.cl').offsetTop - 80); }, 0);
  body.append(choices(q.options, q.answer, fmt, done));
};
BUILD.tree = (q, body, done) => {
  body.append(codeBox(getCode(q)));
  const c = choices(q.options, q.answer, o => '<pre class="tree">' + esc(treeText(parseTree(o))) + '</pre>', done);
  c.classList.add('tree2');
  body.append(c);
};
BUILD.render = (q, body, done) => {
  body.append(codeBox(getCode(q)));
  body.append(el('div', 'sub', 'Which preview does this code produce?'));
  const opts = shuffle([{ h: getCode(q), ok: true }].concat(q.wrong.map(h => ({ h })))), cards = [];
  const grid = el('div', 'pgrid');
  opts.forEach((o, k) => {
    const c = el('div', 'pcard'); c.tabIndex = 0; c.setAttribute('role', 'button');
    c.append(el('span', 'key', KEYS[k]));
    c.append(frame(o.h, q.h || 120), el('div', 'shield'));
    const pick = () => {
      if (S.answered) return;
      cards.forEach((cc, j) => { if (opts[j].ok) cc.classList.add('ok'); });
      if (!o.ok) c.classList.add('bad');
      done(o.ok);
    };
    c.onclick = pick;
    c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
    cards.push(c); grid.append(c);
  });
  body.append(grid);
};
BUILD.click = (q, body, done) => {
  const answers = [].concat(q.answer).map(normSel);
  const wantAttr = answers[0][0] === '@';
  const box = codeBox(getCode(q));
  box.firstChild.classList.add('clickable');
  body.append(box);
  const grp = t => t.closest(wantAttr ? '[data-asel]' : '[data-sel]');
  const peers = t => wantAttr ? $$('[data-asel="' + t.dataset.asel + '"]', box) : $$('[data-t="' + t.dataset.t + '"]', box);
  let hov = [];
  box.onmouseover = e => {
    hov.forEach(x => x.classList.remove('hov'));
    const t = S.answered ? null : grp(e.target);
    hov = t ? peers(t) : [];
    hov.forEach(x => x.classList.add('hov'));
  };
  box.onmouseleave = () => hov.forEach(x => x.classList.remove('hov'));
  box.onclick = e => {
    if (S.answered) return;
    const t = grp(e.target); if (!t) return;
    const got = wantAttr ? t.dataset.asel : t.dataset.sel;
    const ok = answers.includes(got);
    hov.forEach(x => x.classList.remove('hov'));
    peers(t).forEach(x => x.classList.add(ok ? 'ok' : 'bad'));
    if (!ok) answers.forEach(a => $$('[' + (wantAttr ? 'data-asel' : 'data-sel') + '="' + a + '"]', box).forEach(x => x.classList.add('ok')));
    done(ok);
  };
  body.append(el('div', 'sub', wantAttr ? 'Click directly on the attribute.' : 'Click on the tag you think is right (any part of it).'));
};
BUILD.bug = (q, body, done) => {
  const answers = [].concat(q.answer);
  const box = codeBox(getCode(q));
  box.firstChild.classList.add('lineclick');
  body.append(box);
  box.onclick = e => {
    if (S.answered) return;
    const l = e.target.closest('.cl'); if (!l) return;
    const ok = answers.includes(+l.dataset.line);
    l.classList.add(ok ? 'ok' : 'bad');
    if (!ok) answers.forEach(a => { const x = $('.cl[data-line="' + a + '"]', box); if (x) x.classList.add('ok'); });
    done(ok);
  };
  body.append(el('div', 'sub', 'Click a whole line.'));
};
BUILD.match = (q, body, done) => {
  const pairs = q.pairs;
  body.append(el('div', 'sub', 'Click a snippet, then click the preview it produces.'));
  const wrap = el('div', 'match'), left = el('div', 'mleft'), right = el('div', 'mright');
  const status = el('div', 'mstatus');
  const Ls = pairs.map((p, i) => { const d = el('div', 'mitem'); d.append(el('pre', 'mini', highlight(norm0(p.code), { flat: true }))); d._i = i; return d; });
  const Rs = shuffle(pairs.map((p, i) => i)).map(i => {
    const d = el('div', 'mitem mprev'); d._i = i;
    d.append(frame(norm0(pairs[i].code), q.h || 80), el('div', 'shield'));
    return d;
  });
  Ls.forEach(d => left.append(d)); Rs.forEach(d => right.append(d));
  wrap.append(left, right); body.append(wrap, status);
  let sel = null, flawed = false, remaining = pairs.length;
  Ls.forEach(d => d.onclick = () => {
    if (S.answered || d.classList.contains('done')) return;
    Ls.forEach(x => x.classList.remove('sel')); d.classList.add('sel'); sel = d;
  });
  Rs.forEach(d => d.onclick = () => {
    if (S.answered || !sel || d.classList.contains('done')) return;
    if (sel._i === d._i) {
      const num = pairs.length - remaining + 1;
      [sel, d].forEach(x => { x.classList.add('done'); x.classList.remove('sel'); x.append(el('span', 'mnum', String(num))); });
      sel = null; remaining--;
      if (remaining === 0) done(!flawed);
    } else {
      flawed = true;
      d.classList.add('shake'); setTimeout(() => d.classList.remove('shake'), 400);
      sel.classList.remove('sel'); sel = null;
      status.textContent = 'Not a match. Keep going, but this question now counts as a mistake.';
    }
  });
};
const FORM_HELPER = '<scr' + 'ipt>(function(){var f=document.forms[0],bad=false;f.addEventListener("invalid",function(){bad=true},true);' +
  'f.addEventListener("submit",function(e){e.preventDefault();parent.postMessage({fs:"submitted"},"*")});' +
  'f.querySelector("[type=submit]").addEventListener("click",function(){bad=false;setTimeout(function(){if(bad)parent.postMessage({fs:"blocked"},"*")},60)});})();</scr' + 'ipt>';
BUILD.form = (q, body, done) => {
  const form = '<form action="#">\n' + q.html.split('\n').map(l => '  ' + l).join('\n') + '\n  <button type="submit">Submit</button>\n</form>';
  body.append(codeBox(form));
  const live = el('div', 'live'); live.hidden = true;
  const c = choices(['Blocked by the browser', 'Submits successfully'], q.answer === 'blocked' ? 0 : 1, esc, ok => {
    done(ok);
    live.hidden = false;
    const f = frame(form + FORM_HELPER, 110, 'allow-scripts allow-forms');
    const st = el('div', 'lstatus', 'Press Submit in the form above to see what really happens.');
    live.append(el('div', 'sub', 'Now try it yourself (you can change the fields too):'), f, st);
    msgHandlers.push(e => {
      if (e.source !== f.contentWindow || !e.data || !e.data.fs) return;
      st.className = 'lstatus ' + (e.data.fs === 'submitted' ? 's1' : 's2');
      st.textContent = e.data.fs === 'submitted' ? '✔ The browser accepted the form and would send it now.' : '✖ The browser blocked the submission and showed a validation message.';
    });
  }, true);
  body.append(c, live);
};
// Keyboard shortcuts: A-D or 1-4 pick the n-th option
document.addEventListener('keydown', e => {
  if (S.mode !== 'quiz' || S.answered || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))) return;
  const k = e.key.length === 1 ? e.key.toUpperCase() : '';
  let idx = KEYS.indexOf(k); if (idx < 0 && /[1-7]/.test(k)) idx = +k - 1;
  if (idx < 0) return;
  const t = $$('#v-learn .choices .choice, #v-learn .pgrid .pcard')[idx];
  if (t) t.click();
});

/* ================= playground ================= */
const pg = { ready: false, hover: -1, toks: [] };
const PG_HELPER = '<style>[data-pg-hl]{outline:2px solid #f59e0b!important;outline-offset:-2px;background-color:rgba(245,158,11,.22)!important}</style>' +
  '<scr' + 'ipt>addEventListener("mouseover",function(e){var t=e.target.closest&&e.target.closest("[data-pg]");parent.postMessage({pg:t?+t.getAttribute("data-pg"):-1},"*")});' +
  'addEventListener("mouseout",function(e){if(!e.relatedTarget)parent.postMessage({pg:-1},"*")});' +
  'addEventListener("message",function(e){var o=document.querySelectorAll("[data-pg-hl]");for(var i=0;i<o.length;i++)o[i].removeAttribute("data-pg-hl");' +
  'if(e.data&&e.data.hl>=0){var t=document.querySelector("[data-pg=\\""+e.data.hl+"\\"]");if(t)t.setAttribute("data-pg-hl","")}});</scr' + 'ipt>';
const PG_STARTER = '<h1>Hello, HTML!</h1>\n<p>Hover a tag in the editor, or an element on the right.</p>\n<ul>\n  <li>One</li>\n  <li><a href="#">Two</a></li>\n</ul>';
function pgDoc(src, toks) {
  let out = '', cur = 0;
  toks.forEach(t => { if (t.type === 'open') { const at = t.start + 1 + t.name.length; out += src.slice(cur, at) + ' data-pg="' + t.pg + '"'; cur = at; } });
  out += src.slice(cur);
  return previewDoc(out) + PG_HELPER;
}
function pgSetHover(id, fromFrame) {
  if (id === pg.hover) return;
  pg.hover = id;
  $$('.pgon', pg.hl).forEach(x => x.classList.remove('pgon'));
  if (id >= 0) $$('[data-pg="' + id + '"]', pg.hl).forEach(x => x.classList.add('pgon'));
  if (!fromFrame && pg.frame.contentWindow) pg.frame.contentWindow.postMessage({ hl: id }, '*');
  if (id >= 0) {
    const t = pg.toks.find(x => x.type === 'open' && x.pg === id);
    pg.info.innerHTML = t ? tipFor(t.name) : '';
  } else pg.info.textContent = 'Hover a tag to see what it is.';
}
function pgRender() {
  const src = pg.ta.value;
  pg.toks = tokenize(src);
  pg.hl.innerHTML = highlight(src, { flat: true, pg: true }) + '\n ';
  pg.hover = -2; pgSetHover(-1);
  clearTimeout(pg.timer);
  pg.timer = setTimeout(() => { pg.frame.srcdoc = pgDoc(src, pg.toks); }, 250);
}
function initPlayground() {
  if (pg.ready) return;
  pg.ready = true;
  const v = $('#v-play');
  v.innerHTML = '<div class="pgbar"><label>Load example <select id="pgsel"></select></label><button class="btn ghost" id="pgreset">Reset</button>' +
    '<span class="muted">Edit on the left. Hover a tag on either side to highlight its twin.</span></div>' +
    '<div class="pgsplit"><div class="pgleft"><div class="pgedit"><pre id="pghl" aria-hidden="true"></pre>' +
    '<textarea id="pgta" spellcheck="false" wrap="off" aria-label="HTML editor"></textarea></div><div class="pginfo" id="pginfo"></div></div>' +
    '<div class="pgright"><iframe id="pgframe" title="Live preview" sandbox="allow-scripts"></iframe></div></div>';
  pg.ta = $('#pgta'); pg.hl = $('#pghl'); pg.frame = $('#pgframe'); pg.info = $('#pginfo');
  const presets = [{ name: 'Starter', code: PG_STARTER }];
  COURSE.levels.forEach((L, i) => presets.push({ name: 'Level ' + (i + 1) + ': ' + L.title, code: norm0(L.example.code === '@shared' ? L.shared : L.example.code) }));
  const sel = $('#pgsel');
  presets.forEach((p, i) => sel.append(new Option(p.name, i)));
  sel.onchange = () => { pg.ta.value = presets[+sel.value].code; pgRender(); };
  $('#pgreset').onclick = () => { sel.value = 0; pg.ta.value = PG_STARTER; pgRender(); };
  pg.ta.oninput = pgRender;
  pg.ta.onscroll = () => { pg.hl.scrollTop = pg.ta.scrollTop; pg.hl.scrollLeft = pg.ta.scrollLeft; };
  pg.ta.onkeydown = e => {
    if (e.key === 'Tab') { e.preventDefault(); pg.ta.setRangeText('  ', pg.ta.selectionStart, pg.ta.selectionEnd, 'end'); pgRender(); }
  };
  // The textarea sits on top of the highlighted layer, so look at everything under the pointer
  pg.ta.onmousemove = e => {
    const s = document.elementsFromPoint(e.clientX, e.clientY).find(x => x.dataset && x.dataset.pg !== undefined && pg.hl.contains(x));
    pgSetHover(s ? +s.dataset.pg : -1);
  };
  pg.ta.onmouseleave = () => pgSetHover(-1);
  msgHandlers.push(e => { if (e.source === pg.frame.contentWindow && e.data && 'pg' in e.data) pgSetHover(e.data.pg, true); });
  pg.ta.value = PG_STARTER;
  pgRender();
}

/* ================= cheat sheet ================= */
const ch = { ready: false, kind: 'all', q: '' };
function cheatName(r) { return r[1] === 'tag' ? (r[0] === '!DOCTYPE' ? '<!DOCTYPE html>' : '<' + r[0] + '>') : r[0]; }
function initCheat() {

/* ================= authoring checker ================= */
window.checkCourse = function () {
  const issues = [], types = Object.keys(BUILD);
  const hasSel = (toks, s) => { s = normSel(s); return toks.some(t => (s[0] === '@' ? (t.attrs || []).some(a => a.sel === s) : (t.type === 'open' || t.type === 'close') && t.sel === s)); };
  COURSE.levels.forEach(L => {
    const min = ['L6', 'L7', 'L10'].includes(L.id) ? 15 : 10;
    if (L.questions.length < min) issues.push(L.id + ': only ' + L.questions.length + ' questions (need ' + min + ')');
    if (L.id === 'L10') { const n = norm0(L.shared).split('\n').length; if (n < 60 || n > 120) issues.push('L10: shared page has ' + n + ' lines (60-120 wanted)'); }
    const cnt = {};
    L.questions.forEach(q => {
      const w = q.id + ': ';
      if (!types.includes(q.type)) issues.push(w + 'unknown type ' + q.type);
      if (!q.q) issues.push(w + 'missing q');
      if (!q.why) issues.push(w + 'missing why');
      (q.topics || []).forEach(t => { cnt[t] = (cnt[t] || 0) + 1; if (!L.topicList.includes(t)) issues.push(w + 'topic not in topicList: ' + t); });
      if (q.type === 'click') { const toks = tokenize(getCode(q)); [].concat(q.answer).forEach(a => { if (!hasSel(toks, a)) issues.push(w + 'click answer not found: ' + a); }); }
      if (q.type === 'parent') { if (!hasSel(tokenize(getCode(q)), q.target)) issues.push(w + 'parent target not found: ' + q.target); if (!q.options || !q.options[q.answer]) issues.push(w + 'bad answer index'); }
      if (q.type === 'bug') { const n = getCode(q).split('\n').length; [].concat(q.answer).forEach(a => { if (a < 1 || a > n) issues.push(w + 'bug line out of range: ' + a); }); }
      if (q.type === 'render' && (!q.wrong || q.wrong.length < 2)) issues.push(w + 'render needs at least 2 wrong previews');
      if (q.type === 'tree') { if (q.options.length < 3 || !q.options[q.answer]) issues.push(w + 'tree options/answer'); q.options.forEach(o => { try { parseTree(o); } catch (e) { issues.push(w + 'bad tree ' + o); } }); }
      if (['choice', 'happens', 'versus'].includes(q.type) && (!q.options || !q.options[q.answer])) issues.push(w + 'bad answer index');
      if (q.type === 'form' && !['blocked', 'submits'].includes(q.answer)) issues.push(w + 'form answer must be blocked|submits');
      if (q.type === 'match' && (!q.pairs || q.pairs.length < 2)) issues.push(w + 'match needs pairs');
    });
    (L.topicList || []).forEach(t => { if ((cnt[t] || 0) < 2) issues.push(L.id + ': topic "' + t + '" has ' + (cnt[t] || 0) + ' question(s), need 2'); });
  });
  return issues;
};
if (/[?&]check\b/.test(location.search)) {
  const r = window.checkCourse();
  console.log('Course check: ' + (r.length ? r.length + ' issue(s)' : 'OK'));
  r.forEach(x => console.warn(x));
}

/* ================= boot ================= */
updateStats();
showLevels();
})();
